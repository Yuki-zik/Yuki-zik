name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-summary-cards.yml'
      - 'scripts/profile/**'

permissions:
  contents: write

concurrency:
  group: profile-main-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: buefy
          UTC_OFFSET: 8
          AUTO_PUSH: false
      # Keep the theme's background: transparent dark text disappears in dark mode.
      # Validate before committing, and never swallow generation or XML errors.
      - name: Validate all five cards
        run: python3 scripts/profile/validate-assets.py cards
      - name: Commit verified cards
        run: bash scripts/profile/commit-assets.sh profile-summary-card-output/buefy
